<!--
  =====================================================================
   PETALFALL — The Wind Beneath the Blossom
   A hand-painted (procedural) 2D action-platformer in a single file.
  =====================================================================
   CONTROLS (remappable in Controls; full gamepad support)
     Move ............ A / D  or  Left / Right      Aim/Up ...... W / Up
     Jump ............ Space   (hold while falling = Paper Umbrella glide)
     Petal Dash ...... Shift + direction (8-way, invulnerable)
     Gale Strike ..... J / Left Click   (hold J = Bloom Burst)
     Rootslam ........ Down + J in the air
     Gale Rebound .... hold K / Right Click near a lantern, foe or ink shot; aim; release
     Bamboo Grapple .. L          Lantern Flare ... F (throw Hoshi), F again (teleport)
     Map ............. M          Pause ........... Esc
     Gamepad: A jump · X strike · B/LT rebound · Y grapple · LB flare · RB/RT dash · Start pause
  ---------------------------------------------------------------------
   DESIGN NOTE
   Seven regions (Blossom Hollow → The Inkroot), ten abilities each gated
   and required at least once, three phase-based bosses plus a gauntlet,
   two Ink Tide escapes and a Glass Crane flight. The world is painted
   with Canvas2D (procedural watercolor layers, baked tile chunks) and
   composited through a Three.js r128 post pass (bright-pass gaussian
   bloom, chromatic shimmer, vignette, warm grade, 3% grain). Physics run
   at a fixed 120 Hz with interpolated rendering. All sound is synthesized
   with Web Audio — effects and natural ambience only, no music.
   Every character is faceless; no religious imagery anywhere.
   Progress lives in memory; use Pause → Save Code to keep it.
  =====================================================================
-->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PETALFALL — The Wind Beneath the Blossom</title>
<style>
html,body{margin:0;height:100%;background:#0b0b12;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
#wrap{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;transform:translate(-50%,-50%);background:#0b0b12;cursor:crosshair}
#wrap canvas{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
#c2d{display:none}
#save{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,10,18,.55);z-index:5}
#save .card{width:640px;padding:28px 32px;background:linear-gradient(#fff8ec,#f3e6d2);color:#3a1c2a;box-shadow:6px 8px 0 rgba(0,0,0,.25);border:1px solid rgba(176,90,122,.35)}
#save h2{margin:0 0 10px;font-style:italic;font-size:30px}
#save p{margin:0 0 12px;font-size:16px;color:#5a4a52}
#save textarea{width:100%;height:150px;box-sizing:border-box;font:12px monospace;background:#fffdf8;border:1px solid #d8c8c0;color:#3a1c2a;padding:8px;resize:none}
#save button{margin:12px 10px 0 0;padding:8px 22px;font:italic 700 17px Georgia,serif;background:#f49ab6;color:#3a1c2a;border:none;cursor:pointer}
#save button:hover{background:#ffd9e2}
</style></head>
<body>
<div id="wrap">
  <canvas id="gl" width="1280" height="720"></canvas>
  <canvas id="c2d" width="1280" height="720"></canvas>
  <canvas id="ui" width="1280" height="720"></canvas>
  <div id="save"><div class="card"><h2>Save Code</h2><p id="saveMsg"></p><textarea id="saveText" spellcheck="false"></textarea>
  <div><button id="saveCopy">Copy</button><button id="saveLoad">Load</button><button id="saveClose">Close</button></div></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   0. UTILITIES
   ===================================================================== */
const VW = 512, VH = 288, T = 16, STEP = 1 / 120;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const now = () => performance.now();
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function hash2(x, y) { return hash(x * 12.9898 + y * 78.233); }
function vnoise(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); }
function vnoise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), ux), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), ux), uy);
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const _hc = {};
function hexRgb(h) { let r = _hc[h]; if (r) return r; const n = parseInt(h.slice(1), 16); r = _hc[h] = [n >> 16 & 255, n >> 8 & 255, n & 255]; return r; }
function rgba(h, a) { const c = hexRgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (+a).toFixed(3) + ')'; }
function mixHex(a, b, t) { const x = hexRgb(a), y = hexRgb(b); return '#' + [0, 1, 2].map(i => Math.round(lerp(x[i], y[i], t)).toString(16).padStart(2, '0')).join(''); }
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

/* =====================================================================
   1. CONFIG — every tuning constant in one place
   ===================================================================== */
const Config = {
  rs: 2.5,                       // render scale: canvas px per world unit (512x288 -> 1280x720)
  phys: {
    run: 150, accel: 1250, decel: 1875, airMul: 0.8,
    grav: 1100, fallMul: 1.6, apexMul: 0.5, apexV: 45,
    jumpV: 340, jump2V: 300, termV: 430,
    coyote: 0.10, buffer: 0.12,
    wallSlide: 62, wallJumpVX: 175, wallJumpVY: 330, wallLock: 0.08,
    dashV: 330, dashT: 0.16, dashIF: 0.07,
    glideFall: 42, slamV: 560,
    reboundV: 470, reboundR: 46, grappleR: 150,
    flareV: 290, flareT: 0.75, corner: 4,
    updraft: -235
  },
  pw: 9, ph: 13,                 // player hurtbox (~70% of the drawn sprite)
  hitstop: 0.06, iframes: 1.0,
  tideX: 108, tideY: 36,
  col: {
    pink: '#F7B7C8', blush: '#FFD9E2', gold: '#FFD58A', amber: '#FF9F45', jade: '#6FCF97', bamboo: '#9BC53D',
    indigo: '#2E3A87', cyan: '#A8E6FF', cream: '#FFF6E9', ink: '#0B0B12', inkV: '#3B1F5C',
    scarf: '#3A4FD8', scarfTip: '#8A4FD8'
  },
  costs: [20, 45, 80]
};

/* =====================================================================
   2. INPUT — keyboard, mouse, gamepad; 120 ms buffering; remappable
   ===================================================================== */
const DEFAULT_BIND = {
  left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
  jump: ['Space'], dash: ['ShiftLeft', 'ShiftRight'], attack: ['KeyJ'], rebound: ['KeyK'],
  grapple: ['KeyL'], flare: ['KeyF'], map: ['KeyM'], pause: ['Escape']
};
const ACTION_NAMES = { left: 'Move left', right: 'Move right', up: 'Up / aim', down: 'Down / slam', jump: 'Jump / glide', dash: 'Petal Dash', attack: 'Gale Strike / Bloom', rebound: 'Gale Rebound', grapple: 'Bamboo Grapple', flare: 'Lantern Flare', map: 'Valley map', pause: 'Pause' };
const Input = {
  bind: JSON.parse(JSON.stringify(DEFAULT_BIND)),
  fixed: { confirm: ['Enter', 'NumpadEnter', 'Space', 'KeyJ'], back: ['Escape', 'Backspace'], mUp: ['ArrowUp', 'KeyW'], mDown: ['ArrowDown', 'KeyS'], mLeft: ['ArrowLeft', 'KeyA'], mRight: ['ArrowRight', 'KeyD'] },
  keys: new Set(), pad: {}, padPrev: {}, mouseHeld: {}, tapT: {},
  mouse: { x: VW / 2, y: VH / 2, moveT: -1e9, click: null, inside: false },
  padMove: 0, padMoveY: 0, padAim: [0, 0], lastDevice: 'kb', rebindCb: null,
  init(el) {
    addEventListener('keydown', e => {
      if (typeof Save !== 'undefined' && Save.modalOpen) return;
      if (this.rebindCb) { e.preventDefault(); const cb = this.rebindCb; this.rebindCb = null; cb(e.code); return; }
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
      Sound.unlock();
      if (e.repeat) return;
      this.keys.add(e.code); this.lastDevice = 'kb';
      for (const a of this.actionsOf(e.code)) this.tapT[a] = now();
    });
    addEventListener('keyup', e => { this.keys.delete(e.code); });
    addEventListener('blur', () => { this.keys.clear(); this.mouseHeld = {}; });
    const pos = e => {
      const r = el.getBoundingClientRect();
      this.mouse.x = (e.clientX - r.left) / r.width * VW; this.mouse.y = (e.clientY - r.top) / r.height * VH;
    };
    el.addEventListener('mousemove', e => { pos(e); this.mouse.moveT = now(); this.lastDevice = 'kb'; });
    el.addEventListener('mousedown', e => {
      Sound.unlock(); pos(e); this.mouse.moveT = now();
      if (e.button === 0) { this.mouseHeld.attack = true; this.tapT.attack = now(); this.mouse.click = { x: this.mouse.x, y: this.mouse.y, t: now() }; }
      if (e.button === 2) { this.mouseHeld.rebound = true; this.tapT.rebound = now(); }
      e.preventDefault();
    });
    addEventListener('mouseup', e => { if (e.button === 0) this.mouseHeld.attack = false; if (e.button === 2) this.mouseHeld.rebound = false; });
    el.addEventListener('contextmenu', e => e.preventDefault());
    el.addEventListener('wheel', e => { this.wheel = (this.wheel || 0) + Math.sign(e.deltaY); }, { passive: true });
  },
  actionsOf(code) {
    const r = [];
    for (const a in this.bind) if (this.bind[a].includes(code)) r.push(a);
    for (const a in this.fixed) if (this.fixed[a].includes(code)) r.push(a);
    return r;
  },
  down(a) {
    const b = this.bind[a] || this.fixed[a];
    if (b) for (const c of b) if (this.keys.has(c)) return true;
    return !!(this.pad[a] || this.mouseHeld[a]);
  },
  tap(a, win = 0.12) { const t = this.tapT[a]; return t !== undefined && now() - t <= win * 1000; },
  consume(a) { this.tapT[a] = -1e9; },
  clearTaps() { this.tapT = {}; this.mouse.click = null; },
  axisX() {
    let x = (this.down('right') ? 1 : 0) - (this.down('left') ? 1 : 0);
    if (x === 0 && Math.abs(this.padMove) > 0.3) x = Math.sign(this.padMove);
    return x;
  },
  pollPad() {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp = null;
    if (gps) for (const g of gps) if (g && g.connected) { gp = g; break; }
    for (const k in this.pad) this.pad[k] = false;
    if (!gp) { this.padMove = 0; this.padMoveY = 0; return; }
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const ax = gp.axes || [];
    const lx = ax[0] || 0, ly = ax[1] || 0;
    const map = { jump: [0], rebound: [1, 6], attack: [2], grapple: [3], flare: [4], dash: [5, 7], map: [8], pause: [9], up: [12], down: [13], left: [14], right: [15], confirm: [0], back: [1], mUp: [12], mDown: [13], mLeft: [14], mRight: [15] };
    let any = false;
    for (const a in map) {
      let h = map[a].some(b);
      if ((a === 'left' || a === 'mLeft') && lx < -0.5) h = true;
      if ((a === 'right' || a === 'mRight') && lx > 0.5) h = true;
      if ((a === 'up' || a === 'mUp') && ly < -0.5) h = true;
      if ((a === 'down' || a === 'mDown') && ly > 0.5) h = true;
      this.pad[a] = h;
      if (h && !this.padPrev[a]) { this.tapT[a] = now(); any = true; }
      this.padPrev[a] = h;
    }
    this.padMove = Math.abs(lx) > 0.2 ? lx : 0; this.padMoveY = Math.abs(ly) > 0.2 ? ly : 0;
    this.padAim = [ax[2] || 0, ax[3] || 0];
    if (any || Math.abs(lx) > 0.3) this.lastDevice = 'pad';
  },
  keyName(code) {
    if (!code) return '—';
    return code.replace('Key', '').replace('Digit', '').replace('Arrow', '').replace('Left', ' L').replace('Right', ' R').replace('Shift L', 'Shift').replace('Space', 'Space');
  }
};

/* =====================================================================
   13. AUDIO — 100% synthesized SFX and natural ambience. No music.
   ===================================================================== */
const Sound = {
  ctx: null, ok: false, vol: 0.8,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      this.ctx = new C(); this.build(); this.ok = true;
    } catch (e) { this.ok = false; }
  },
  build() {
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = this.vol;
    this.duck = c.createBiquadFilter(); this.duck.type = 'lowpass'; this.duck.frequency.value = 18000; this.duck.Q.value = 0.5;
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -16; this.comp.ratio.value = 4; this.comp.attack.value = 0.003; this.comp.release.value = 0.25;
    this.bus = c.createGain();
    this.bus.connect(this.duck); this.duck.connect(this.comp); this.comp.connect(this.master); this.master.connect(c.destination);
    this.rev = c.createConvolver(); this.rev.buffer = this.makeIR(2.6, 2.6);
    this.revOut = c.createGain(); this.revOut.gain.value = 0.42;
    this.rev.connect(this.revOut); this.revOut.connect(this.duck);
    const len = c.sampleRate * 2;
    this.nbuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.nbuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.bbuf = c.createBuffer(1, len, c.sampleRate);
    const e = this.bbuf.getChannelData(0); let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; e[i] = last * 3.5; }
    this.ambBuild();
  },
  makeIR(dur, decay) {
    const c = this.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay) * (i < 200 ? i / 200 : 1); }
    return b;
  },
  setVol(v) { this.vol = v; if (this.master) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05); },
  out(pan, rev) {
    const c = this.ctx, g = c.createGain();
    let tail = g;
    if (c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(pan || 0, -1, 1); g.connect(p); tail = p; }
    tail.connect(this.bus);
    if (rev) { const s = c.createGain(); s.gain.value = rev; tail.connect(s); s.connect(this.rev); }
    return g;
  },
  noise(o) {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource(); src.buffer = o.brown ? this.bbuf : this.nbuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(clamp(o.f || 1000, 20, 20000), t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(clamp(o.f2, 20, 20000), t + (o.sweep || o.dur));
    f.Q.value = o.q || 1;
    const amp = c.createGain();
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.gain || 0.2), t + (o.a || 0.004));
    amp.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(amp); amp.connect(this.out(o.pan, o.rev));
    src.start(t, Math.random() * 1.5); src.stop(t + o.dur + 0.05);
  },
  tone(o) {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(); osc.type = o.wave || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(10, o.f2), t + (o.sweep || o.dur));
    const amp = c.createGain();
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.gain || 0.1), t + (o.a || 0.004));
    amp.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(amp); amp.connect(this.out(o.pan, o.rev));
    osc.start(t); osc.stop(t + o.dur + 0.05);
  },
  ks(f, dur, gain, pan) { // Karplus–Strong single taut tick (non-musical, random pitch)
    if (!this.ok) return;
    const c = this.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    const P = Math.max(2, Math.floor(c.sampleRate / f)); const ring = new Float32Array(P);
    for (let i = 0; i < P; i++) ring[i] = Math.random() * 2 - 1;
    let idx = 0;
    for (let i = 0; i < n; i++) { const nx = (idx + 1) % P; const v = (ring[idx] + ring[nx]) * 0.496; d[i] = ring[idx] * Math.pow(1 - i / n, 2); ring[idx] = v; idx = nx; }
    const s = c.createBufferSource(); s.buffer = b; const g = c.createGain(); g.gain.value = gain;
    s.connect(g); g.connect(this.out(pan, 0.2)); s.start();
  },
  duckTo(freq, time) { if (!this.ok) return; const t = this.ctx.currentTime; this.duck.frequency.cancelScheduledValues(t); this.duck.frequency.setTargetAtTime(freq, t, time || 0.05); },
  px(x) { if (typeof Cam === 'undefined') return 0; return clamp((x - (Cam.x + VW / 2)) / (VW * 0.6), -1, 1) * 0.75; },
  // ---------------- SFX ----------------
  step(surf, x) {
    const p = this.px(x), k = rnd(0.92, 1.08);
    switch (surf) {
      case 'grass': this.noise({ type: 'lowpass', f: 900 * k, q: .7, dur: .07, gain: .09, pan: p }); this.noise({ type: 'highpass', f: 4200 * k, dur: .03, gain: .025, pan: p }); break;
      case 'stone': this.noise({ type: 'bandpass', f: 2600 * k, q: 3, dur: .035, gain: .11, pan: p }); break;
      case 'wood': this.noise({ type: 'bandpass', f: 700 * k, q: 6, dur: .05, gain: .11, pan: p }); this.tone({ f: 190 * k, f2: 120, dur: .05, gain: .04, wave: 'triangle', pan: p }); break;
      case 'water': this.noise({ type: 'bandpass', f: 1600 * k, f2: 500, dur: .14, gain: .11, pan: p, q: 1.5 }); break;
      case 'snow': this.noise({ type: 'lowpass', f: 1400 * k, dur: .09, gain: .09, pan: p }); this.noise({ type: 'highpass', f: 6000, dur: .04, gain: .02, pan: p }); break;
      default: this.noise({ type: 'lowpass', f: 520 * k, dur: .06, gain: .09, pan: p });
    }
  },
  jump(x) { this.noise({ type: 'bandpass', f: 700, f2: 2200, dur: .15, gain: .1, q: .8, pan: this.px(x) }); },
  djump(x) {
    const p = this.px(x);
    this.noise({ type: 'highpass', f: 2600, f2: 5000, dur: .28, gain: .07, pan: p, rev: .4 });
    for (let i = 0; i < 5; i++) this.tone({ f: rnd(2400, 5200), dur: .07, gain: .018, delay: i * rnd(.01, .03), pan: p + rnd(-.2, .2), rev: .5 });
  },
  land(h, x) {
    const v = clamp(h / 160, 0.15, 1), p = this.px(x);
    this.noise({ type: 'lowpass', f: 300 + v * 500, dur: .1 + v * .08, gain: .12 + v * .25, pan: p });
    this.tone({ f: 95, f2: 45, dur: .12, gain: .08 + v * .2, pan: p });
  },
  dash(x) { const p = this.px(x); this.noise({ type: 'bandpass', f: 3400, f2: 450, dur: .2, gain: .22, q: 1.2, pan: p }); this.tone({ f: 320, f2: 110, dur: .16, gain: .045, wave: 'triangle', pan: p }); },
  slash(i, x) {
    const p = this.px(x), k = 1 + i * 0.12;
    this.noise({ type: 'bandpass', f: 1900 * k, f2: 520, dur: .13, gain: .16, q: 1.6, pan: p });
    this.noise({ type: 'highpass', f: 5200, dur: .06, gain: .05, pan: p });
    this.noise({ type: 'bandpass', f: 900 * k, f2: 300, dur: .1, gain: .07, q: 2, pan: p, delay: .015 });
  },
  hit(x) {
    const p = this.px(x);
    this.tone({ f: 1900, f2: 900, dur: .025, gain: .05, wave: 'square', pan: p });
    this.noise({ type: 'lowpass', f: 420, dur: .1, gain: .25, pan: p });
    this.tone({ f: 120, f2: 55, dur: .12, gain: .22, pan: p });
  },
  clink(x) { const p = this.px(x); this.tone({ f: 2350, dur: .07, gain: .05, wave: 'triangle', pan: p }); this.tone({ f: 3170, dur: .05, gain: .035, wave: 'triangle', pan: p }); this.noise({ type: 'highpass', f: 5000, dur: .05, gain: .06, pan: p }); },
  reboundIn() { this.noise({ type: 'lowpass', f: 3200, f2: 240, dur: .45, gain: .14, rev: .5 }); this.duckTo(1300, .08); },

/* =====================================================================
   4. ASSET FORGE — every sprite is painted procedurally at load
   ===================================================================== */
const Forge = {
  glows: {}, petals: [], leaves: [], grain: null, flakes: null,
  glow(col, size = 64) {
    const k = col + size; if (this.glows[k]) return this.glows[k];
    const c = mkCanvas(size, size), x = c.getContext('2d');
    const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0, rgba(col, 1)); g.addColorStop(.25, rgba(col, .55)); g.addColorStop(.6, rgba(col, .14)); g.addColorStop(1, rgba(col, 0));
    x.fillStyle = g; x.fillRect(0, 0, size, size);
    return (this.glows[k] = c);
  },
  init() {
    // petals: five tints, soft notch at tip
    const pc = ['#F7B7C8', '#FFD9E2', '#F49AB6', '#FFE8EE', '#EFA3BF'];
    for (const col of pc) {
      const c = mkCanvas(20, 20), x = c.getContext('2d');
      x.translate(10, 10);
      const g = x.createLinearGradient(-8, 0, 8, 0); g.addColorStop(0, mixHex(col, '#FFFFFF', .5)); g.addColorStop(1, col);
      x.fillStyle = g; x.beginPath();
      x.moveTo(-8, 0); x.bezierCurveTo(-5, -7, 4, -6, 8, -1.5); x.lineTo(6, 0); x.lineTo(8, 1.5); x.bezierCurveTo(4, 6, -5, 7, -8, 0); x.fill();
      x.strokeStyle = rgba('#C06080', .25); x.lineWidth = .6; x.beginPath(); x.moveTo(-7, 0); x.lineTo(5, 0); x.stroke();
      this.petals.push(c);
    }
    for (const col of ['#9BC53D', '#6FA35A', '#B6D86A']) {
      const c = mkCanvas(22, 12), x = c.getContext('2d');
      x.fillStyle = col; x.beginPath(); x.moveTo(1, 6); x.quadraticCurveTo(11, -2, 21, 6); x.quadraticCurveTo(11, 14, 1, 6); x.fill();
      x.strokeStyle = rgba('#2E4A1A', .35); x.lineWidth = .7; x.beginPath(); x.moveTo(2, 6); x.lineTo(20, 6); x.stroke();
      this.leaves.push(c);
    }
    // paper grain tile
    this.grain = mkCanvas(256, 256);
    { const x = this.grain.getContext('2d'), id = x.createImageData(256, 256), d = id.data;
      for (let i = 0; i < d.length; i += 4) { const p = i / 4, gx = p % 256, gy = p / 256 | 0; const v = 128 + (Math.random() - .5) * 90 + (vnoise2(gx / 9, gy / 9) - .5) * 60; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
      x.putImageData(id, 0, 0); }
    // ink droplet and flower sprites
    this.ink = mkCanvas(16, 16); { const x = this.ink.getContext('2d'); const g = x.createRadialGradient(6, 6, 0, 8, 8, 8); g.addColorStop(0, '#5A3A86'); g.addColorStop(.35, '#1A1428'); g.addColorStop(1, 'rgba(11,11,18,0)'); x.fillStyle = g; x.fillRect(0, 0, 16, 16); }
    this.flower = mkCanvas(24, 24); { const x = this.flower.getContext('2d'); x.translate(12, 12);
      for (let i = 0; i < 5; i++) { x.rotate(TAU / 5); x.fillStyle = i % 2 ? '#FFD9E2' : '#F7B7C8'; x.beginPath(); x.ellipse(0, -6, 3.6, 6, 0, 0, TAU); x.fill(); }
      x.fillStyle = '#FFD58A'; x.beginPath(); x.arc(0, 0, 2.6, 0, TAU); x.fill(); }
    this.snowflake = this.glow('#FFFFFF', 16);
  },
  // watercolor blob: overlapping soft disks with noisy alpha
  blob(x, cx, cy, r, col, a, rng) {
    for (let i = 0; i < 6; i++) {
      const ox = (rng() - .5) * r * .5, oy = (rng() - .5) * r * .4, rr = r * (.55 + rng() * .5);
      const g = x.createRadialGradient(cx + ox, cy + oy, rr * .2, cx + ox, cy + oy, rr);
      g.addColorStop(0, rgba(col, a)); g.addColorStop(.7, rgba(col, a * .6)); g.addColorStop(1, rgba(col, 0));
      x.fillStyle = g; x.beginPath(); x.arc(cx + ox, cy + oy, rr, 0, TAU); x.fill();
    }
    // pigment bleed: darker edge ring fragment
    x.strokeStyle = rgba(mixHex(col, '#000000', .25), a * .25); x.lineWidth = 1.2;
    x.beginPath(); x.arc(cx, cy, r * .8, rng() * TAU, rng() * TAU + 1.5); x.stroke();
  }
};

/* =====================================================================
   5. BACKGROUND — baked painterly parallax layers
   ===================================================================== */
const LW = 1024, LH = 360, BS = 1.5;
const BG = {
  theme: null, layers: [], fg: null, fgTop: null, mistCv: null,
  ridge(x, rng, base, amp, freq, colTop, colBot, w) {
    const seed = rng() * 1000;
    const g = x.createLinearGradient(0, base - amp, 0, LH);
    g.addColorStop(0, colTop); g.addColorStop(1, colBot);
    x.fillStyle = g; x.beginPath(); x.moveTo(0, LH);
    for (let i = 0; i <= w; i += 4) {
      const t = i / w; // seamless: blend two noise samples
      const n = lerp(vnoise(seed + i * freq) + vnoise(seed * 2 + i * freq * 2.3) * .45, vnoise(seed + (i - w) * freq) + vnoise(seed * 2 + (i - w) * freq * 2.3) * .45, t);
      x.lineTo(i, base - n * amp);
    }
    x.lineTo(w, LH); x.closePath(); x.fill();
    // ink-wash edge bleed
    x.strokeStyle = rgba(colTop, .35); x.lineWidth = 2;
    x.beginPath();
    for (let i = 0; i <= w; i += 4) { const t = i / w; const n = lerp(vnoise(seed + i * freq) + vnoise(seed * 2 + i * freq * 2.3) * .45, vnoise(seed + (i - w) * freq) + vnoise(seed * 2 + (i - w) * freq * 2.3) * .45, t); i ? x.lineTo(i, base - n * amp - 1) : x.moveTo(i, base - n * amp - 1); }
    x.stroke();
  },
  fogBand(x, col, y0, a) { const g = x.createLinearGradient(0, y0, 0, LH); g.addColorStop(0, rgba(col, 0)); g.addColorStop(1, rgba(col, a)); x.fillStyle = g; x.fillRect(0, y0, LW, LH - y0); },
  tree(x, rng, bx, by, h, th, depth) { // cherry tree: brush trunk + blossom blobs
    x.strokeStyle = th.trunk; x.lineCap = 'round';
    const branch = (px, py, ang, len, wd, lvl) => {
      const ex = px + Math.cos(ang) * len, ey = py + Math.sin(ang) * len;
      x.lineWidth = wd; x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo((px + ex) / 2 + (rng() - .5) * len * .3, (py + ey) / 2, ex, ey); x.stroke();
      if (lvl > 0) { const n = 2 + (rng() < .4 ? 1 : 0); for (let i = 0; i < n; i++) branch(ex, ey, ang + (rng() - .5) * 1.4, len * (.6 + rng() * .2), wd * .62, lvl - 1); }
      else { for (let i = 0; i < 2; i++) Forge.blob(x, ex + (rng() - .5) * 10, ey + (rng() - .5) * 8, 10 + rng() * 10 * depth, rng() < .5 ? th.midCol : th.farCol, .5, rng); }

class Builder {
  constructor(w, h, fill) { this.w = w; this.h = h; this.t = new Array(w * h).fill(fill || ' '); this.ents = []; }
  p(x, y, c) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.t[y * this.w + x] = c; }
  r(x1, y1, x2, y2, c) { c = c || '#'; for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) this.p(x, y, c); }
  g(x1, x2, top, c) { this.r(x1, top, x2, this.h - 1, c || '#'); }
  plat(x1, x2, y) { this.r(x1, y, x2, y, '='); }
  carve(x1, y1, x2, y2) { this.r(x1, y1, x2, y2, ' '); }
  e(type, x, y, o) { this.ents.push(Object.assign({ type, tx: x, ty: y }, o || {})); }
  motes(list) { for (const [x, y] of list) this.e('mote', x, y); }
  crumble(x1, x2, y) { this.e('crumble', x1, y, { tw: x2 - x1 + 1 }); }
}

      const o = Object.assign({}, e, { x, y, k, t: rnd(10) });
      switch (e.type) {
        case 'start': this.spawn = { x, y: y + T / 2 }; continue;
        case 'land': this.land = { x, y: y + T / 2 }; break;
        case 'moth': mothPts.push([x, y]); continue;
        case 'mote': case 'life': if (G.prog.collected[k]) continue; break;
        case 'seed': if (G.prog.abil[e.abil]) continue; break;
        case 'lantern': o.ax = x; o.ay = e.ty * T - 2; o.len = 12; o.a = 0; o.av = 0; break;
        case 'koi': o.w = 44; o.h = 6; o.bx = x - 22; o.by = y + 4; o.ph = rnd(TAU); o.active = true; o.dx = 0; o.dy = 0; o.x = o.bx; o.y = o.by; this.plats.push(o); break;
        case 'crumble': o.x = e.tx * T; o.y = e.ty * T; o.w = e.tw * T; o.h = 6; o.active = true; o.dx = 0; o.dy = 0; o.st = 0; o.tm = 0; o.oy = o.y; this.plats.push(o); break;
        case 'deer': o.done = !!G.prog.secrets[k]; if (o.done) this.reveal(o, true); o.face = 1; break;
      }
      this.ents.push(o);
    }
    if (mothPts.length) this.moth = { pts: mothPts, i: 0, x: mothPts[0][0], y: mothPts[0][1], t: 0 };
    // updraft columns above each vent
    this.updrafts = [];
    for (let tx = 0; tx < this.w; tx++) for (let ty = 0; ty < this.h; ty++) if (this.get(tx, ty) === 'U' && this.get(tx, ty - 1) !== 'U') {
      let top = ty - 1, n = 0; while (top > 0 && !SOLID.has(this.get(tx, top - 1)) && n < 28) { top--; n++; }
      this.updrafts.push({ x: tx * T, y: top * T, w: T, h: (ty - top) * T, base: ty * T });
    }

    // spawn point
    let sp = this.spawn;
    if (mode === 'cp' && G.prog.cp && G.prog.cp.r === r) sp = { x: G.prog.cp.x, y: G.prog.cp.y };
    else if (mode === 'land' && this.land) sp = this.land;
    else if (mode === 'well') { const w = this.ents.find(e => e.type === 'well'); if (w) sp = { x: w.x, y: w.y + T / 2 }; }
    if (mode !== 'cp') G.prog.cp = { r, x: sp.x, y: sp.y };

  },
  reveal(deer, instant) {
    // flood-fill the S cluster nearest to the deer
    let best = null, bd = 1e9;
    for (let i = 0; i < this.t.length; i++) if (this.t[i] === 'S') { const tx = i % this.w, ty = i / this.w | 0, d = Math.abs(tx * T - deer.x) + Math.abs(ty * T - deer.y); if (d < bd) { bd = d; best = [tx, ty]; } }
    if (!best) return [];
    const out = [], st = [best], seen = new Set();
    while (st.length) { const [x, y] = st.pop(), k = x + ',' + y; if (seen.has(k) || this.get(x, y) !== 'S') continue; seen.add(k); out.push([x, y]); st.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]); }
    for (const [x, y] of out) { this.set(x, y, ' '); if (!instant) for (let i = 0; i < 8; i++) Particles.emit('dust', x * T + rnd(T), y * T + rnd(T), rnd(-40, 40), rnd(-60, 10), rnd(.5, 1), rnd(2, 4), THEMES[this.theme].ground.body2); }
    return out;
  },
  updateEnts(dt) {
    const p = Player, pc = { x: p.x + p.w / 2, y: p.y + p.h / 2 };
    for (const pl of this.plats) {
      const ox = pl.x, oy = pl.y;
      if (pl.type === 'koi') { pl.t += dt; pl.x = pl.bx + Math.sin(pl.t * .55 + pl.ph) * 14; pl.y = pl.by + Math.sin(pl.t * 1.2 + pl.ph) * 3; }
      else if (pl.type === 'crumble') {
        if (pl.st === 1) { pl.tm += dt; if (pl.tm > .42) { pl.st = 2; pl.tm = 0; pl.active = false; Sound.crack(pl.x + pl.w / 2); for (let i = 0; i < 14; i++) Particles.emit('dust', pl.x + rnd(pl.w), pl.y + 3, rnd(-30, 30), rnd(-20, 40), rnd(.6, 1.2), rnd(2, 5), THEMES[this.theme].ground.plank); } }
        else if (pl.st === 2) { pl.tm += dt; pl.y += dt * 180 * pl.tm; if (pl.tm > 3 && !G.tide) this.resetCrumble(pl); }
      }
      pl.dx = pl.x - ox; pl.dy = pl.y - oy;
    }
    for (const e of this.ents) {
      e.t += dt;
      const d = dist(pc.x, pc.y, e.x, e.y);
      switch (e.type) {
        case 'lantern': e.av += (-e.a * 22 - e.av * 1.6 + Math.sin(G.t * .9 + e.tx) * .6) * dt; e.a += e.av * dt; e.x = e.ax + Math.sin(e.a) * e.len; e.y = e.ay + Math.cos(e.a) * e.len; break;
        case 'well': if (d < 14 && !p.dead) Game.checkpoint(e); break;
        case 'subcp': if (d < 20 && G.tide) G.subcp = { x: e.x, y: e.y + T / 2 }; break;
        case 'seed': if (d < 15 && !p.dead) { e.dead = true; Game.getSeed(e); } break;
        case 'heart': if (G.prog.restored[this.r] || (this.def.boss && !G.prog.bossDone[this.r])) break; if (d < 18 && !G.restore) Game.restoreStart(e); break;
        case 'mote': if (d < 14) { e.dead = true; G.prog.collected[e.k] = 1; for (let i = 0; i < 6; i++) G.motes.push({ x: e.x, y: e.y, vx: rnd(-90, 90), vy: rnd(-140, -40), t: 0 }); Sound.mote(e.x); Game.say('mote', 'Spring Motes. Gather them, and the Blossom Branch will grow.'); } break;
        case 'life': if (d < 14) { e.dead = true; G.prog.collected[e.k] = 1; Game.lifeFrag(e); } break;
        case 'deer': if (!e.done && d < 80) { e.done = true; G.prog.secrets[e.k] = 1; e.glow = 1; Sound.deer(e.x); this.reveal(e, false); Game.say('deer', 'A Moss Deer… it is showing us something hidden.'); Cam.shake(.15); }
          e.face = pc.x < e.x ? -1 : 1; if (e.glow) e.glow = Math.max(0, e.glow - dt * .3); break;
        case 'exit': if (d < 16 && !G.wipe) Game.exitRegion(); break;
        case 'trig': if (d < 24 && !G.tide && !G.prog.escDone[this.r]) Game.startEscape(e); break;
        case 'flight': if (d < 16 && !G.flight && !G.wipe) Game.startFlight(); break;
      }
    }
    if (this.def.hints) for (const h of this.def.hints) if (pc.x > h[0] * T && pc.x < h[0] * T + 80) Game.say(h[1], h[2]);
    if (this.moth) {
      const m = this.moth, tp = m.pts[m.i];
      if (dist(pc.x, pc.y, tp[0], tp[1]) < 70 && m.i < m.pts.length - 1) m.i++;
      m.t += dt;
      const tx = m.pts[m.i][0] + Math.sin(m.t * 2.3) * 8, ty = m.pts[m.i][1] + Math.cos(m.t * 3.1) * 6;
      m.x = damp(m.x, tx, 1.8, dt); m.y = damp(m.y, ty, 1.8, dt);
      if (Math.random() < dt * 20) Particles.emit('ember', m.x, m.y, rnd(-10, 10), rnd(-20, 0), rnd(.4, .9), rnd(1, 2), '#FFB060');
    }
    this.ents = this.ents.filter(e => !e.dead);
    // touch crumbles

    // free motes: drift, magnetize with easing, collect
    const mag = G.prog.skills.w1 ? 90 : 52;
    for (const m of G.motes) {

      if (dd < 8 && m.t > .2) { m.dead = true; G.prog.motes++; G.prog.stats.motes++; Sound.mote(m.x); HUD.ping(); Particles.emit('glow', m.x, m.y, 0, 0, .3, 8, Config.col.gold); }
    }
    G.motes = G.motes.filter(m => !m.dead);
  },
  resetCrumble(pl) { pl.st = 0; pl.tm = 0; pl.active = true; pl.y = pl.oy; },
  drawEnts(x, rt, pass) {
    const th = THEMES[this.theme];

          x.save(); x.globalCompositeOperation = 'lighter'; x.drawImage(Forge.glow(Config.col.amber), e.x - 26, e.y - 26, 52, 52); x.restore();
          x.save(); x.translate(e.x, e.y); x.rotate(-e.a);
          x.fillStyle = '#FF9F45'; x.beginPath(); x.ellipse(0, 0, 6, 7.5, 0, 0, TAU); x.fill();
          x.fillStyle = rgba('#FFE0A8', .8); x.beginPath(); x.ellipse(-1.5, -1, 3, 5.5, 0, 0, TAU); x.fill();
          x.strokeStyle = rgba('#8A3A1A', .5); x.lineWidth = .6; for (let k = -4; k <= 4; k += 2.6) { x.beginPath(); x.moveTo(-6, k); x.quadraticCurveTo(0, k + 1, 6, k); x.stroke(); }
          x.fillStyle = '#3A2420'; x.fillRect(-3.5, -8.5, 7, 2); x.fillRect(-3.5, 6.5, 7, 2); x.fillRect(-.5, 8.5, 1, 4);
          x.restore(); break;
        }
        case 'node': {

          x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = pulse; x.drawImage(Forge.glow(Config.col.jade), e.x - 20, e.y - 20, 40, 40); x.restore();
          x.fillStyle = '#9BC53D'; x.fillRect(e.x - 3, e.y - 10, 6, 20); x.fillStyle = '#5A8A2A'; x.fillRect(e.x - 4, e.y - 1, 8, 2);
          x.strokeStyle = rgba('#E8FFD0', .9); x.lineWidth = 1.2; x.beginPath(); x.arc(e.x, e.y, 6 + pulse, 0, TAU); x.stroke();
          if (Player.grap && Player.grap.n === e) { x.strokeStyle = rgba('#FFFFFF', .5); x.beginPath(); x.arc(e.x, e.y, 9, 0, TAU); x.stroke(); }
          break;
        }
        case 'well': {
          const act = G.prog.cp && Math.abs(G.prog.cp.x - e.x) < 2 && Math.abs(G.prog.cp.y - (e.y + T / 2)) < 2;
          x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = act ? .9 : .45; x.drawImage(Forge.glow(Config.col.pink), e.x - 22, e.y - 14, 44, 32); x.restore();
          x.fillStyle = rgba('#3A2A3A', .9); x.beginPath(); x.ellipse(e.x, e.y + 7, 10, 3, 0, 0, TAU); x.fill();
          x.fillStyle = rgba('#F7B7C8', act ? .95 : .6); x.beginPath(); x.ellipse(e.x, e.y + 6.5, 8, 2.2, 0, 0, TAU); x.fill();

/* ---- faceless creature drawings (silhouettes and spirit-light only) ---- */
function drawKoi(x, k, rt) {
  const cx = k.x + k.w / 2, cy = k.y + 2, sw = Math.sin(rt * 4 + k.ph) * 3;
  x.save(); x.globalCompositeOperation = 'lighter'; x.drawImage(Forge.glow('#FFB060', 64), cx - 30, cy - 16, 60, 32); x.restore();
  x.save(); x.translate(cx, cy);
  x.fillStyle = rgba('#FF9F45', .35); x.strokeStyle = rgba('#FFE0B0', .95); x.lineWidth = 1.1;
  x.beginPath(); x.moveTo(-18, 0); x.bezierCurveTo(-10, -7, 10, -7, 18, 0); x.bezierCurveTo(10, 5, -10, 5, -18, 0); x.fill(); x.stroke();
  x.beginPath(); x.moveTo(-18, 0); x.lineTo(-26, -5 + sw); x.lineTo(-24, 0); x.lineTo(-26, 5 + sw); x.closePath(); x.fill(); x.stroke();
  x.beginPath(); x.moveTo(0, -5); x.quadraticCurveTo(-4, -10 + sw * .3, -8, -6); x.stroke();
  x.fillStyle = rgba('#FFFFFF', .5); x.beginPath(); x.ellipse(6, -1, 6, 1.4, 0, 0, TAU); x.fill();
  x.restore();
}
function drawDeer(x, e, rt) {
  x.save(); x.translate(e.x, e.y + 8); x.scale(e.face, 1);
  if (e.glow) { x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = e.glow; x.drawImage(Forge.glow(Config.col.jade, 64), -30, -40, 60, 60); x.restore(); }
  const graze = Math.sin(e.t * .7) > .3 ? 4 : 0;
  x.fillStyle = rgba('#2A4A34', .85); x.strokeStyle = rgba('#B6F0C8', .7); x.lineWidth = .8;
  x.beginPath(); x.ellipse(0, -11, 10, 5, 0, 0, TAU); x.fill(); x.stroke();
  for (const lx of [-7, -4, 5, 8]) { x.beginPath(); x.moveTo(lx, -8); x.lineTo(lx + Math.sin(rt * 2 + lx) * .5, 0); x.stroke(); }
  x.beginPath(); x.moveTo(8, -13); x.quadraticCurveTo(12, -18 + graze, 13, -21 + graze * 2); x.lineWidth = 3; x.strokeStyle = rgba('#2A4A34', .9); x.stroke();
  x.fillStyle = rgba('#2A4A34', .95); x.beginPath(); x.ellipse(14, -22 + graze * 2, 3.5, 2.5, .4, 0, TAU); x.fill();
  // blossom antlers
  x.strokeStyle = rgba('#5A3A2A', .9); x.lineWidth = .8;
  for (const s of [-1, 1]) { x.beginPath(); x.moveTo(13, -24 + graze * 2); x.lineTo(13 + s * 3, -30 + graze * 2); x.lineTo(13 + s * 6, -32 + graze * 2); x.stroke(); x.drawImage(Forge.flower, 13 + s * 6 - 3, -35 + graze * 2, 6, 6); x.drawImage(Forge.flower, 13 + s * 2 - 2, -31 + graze * 2, 4, 4); }
  x.restore();
}
function drawMoth(x, mx, my, t) {
  const f = Math.sin(t * 22) * .8;
  x.save(); x.translate(mx, my);
  x.fillStyle = rgba('#FFC07A', .85);
  for (const s of [-1, 1]) { x.beginPath(); x.ellipse(s * 3, 0, 3.5, 2 + f, s * .5, 0, TAU); x.fill(); }
  x.fillStyle = '#FFF0D0'; x.fillRect(-.6, -2, 1.2, 4);
  x.restore();
}
function drawCrane(x, cx, cy, t, flying) {
  const fl = flying ? Math.sin(t * 5) : Math.sin(t * 1.2) * .2;
  x.save(); x.translate(cx, cy);
  x.save(); x.globalCompositeOperation = 'lighter'; x.drawImage(Forge.glow(Config.col.cyan, 64), -40, -30, 80, 60); x.restore();
  x.fillStyle = rgba('#DFF6FF', .35); x.strokeStyle = rgba('#FFFFFF', .85); x.lineWidth = 1;
  // body
  x.beginPath(); x.ellipse(0, 0, 13, 5, -.1, 0, TAU); x.fill(); x.stroke();
  // neck + smooth head shape (no features)
  x.beginPath(); x.moveTo(11, -2); x.quadraticCurveTo(20, -10, 18, -18); x.stroke();
  x.beginPath(); x.ellipse(19, -19, 3, 2, -.3, 0, TAU); x.fill(); x.stroke();
  // wings
  for (const s of [1, -.6]) {
    x.beginPath(); x.moveTo(-2, -2); x.quadraticCurveTo(-10, -18 * fl * s - 6, -26, -14 * fl * s - 4); x.quadraticCurveTo(-14, -2, -2, 2); x.fill(); x.stroke();
  }
  x.beginPath(); x.moveTo(-12, 1); x.lineTo(-22, 4); x.stroke();
  if (!flying) { x.beginPath(); x.moveTo(-2, 4); x.lineTo(-3, 13); x.moveTo(3, 4); x.lineTo(4, 13); x.stroke(); }
  x.restore();
}
function drawHeartbloom(x, e, rt) {
  const R = World.def, hidden = R.boss && !G.prog.bossDone[World.r];
  if (hidden) return;
  const open = G.prog.restored[World.r] ? 1 : (G.restore ? easeOut(G.restore.t / .8) : 0);
  x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = .7 + .3 * Math.sin(e.t * 2); x.drawImage(Forge.glow(Config.col.pink, 128), e.x - 40, e.y - 46, 80, 80); x.restore();
  x.save(); x.translate(e.x, e.y + 8);
  x.strokeStyle = '#4E7A3A'; x.lineWidth = 2; x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(3, -8, 0, -16); x.stroke();

  }
  hitBy(hb) { if (dist(hb.x + hb.w / 2, hb.y + hb.h / 2, this.x, this.y) < this.r + 14) { Sound.clink(this.x); this.flash = .03; Game.say('heartclink', 'Steel against stone… use its own ink, Kaze!'); return true; } return false; }
  projHit(p) {

  rebounded(o, dir) {

        else { const k = clamp((td.t - .8) / .12, 0, 1); x.fillStyle = '#0B0B12'; x.beginPath(); x.moveTo(td.x - 9, 50 * T); x.quadraticCurveTo(td.x + Math.sin(G.t * 10) * 4, 50 * T + (this.floorY - 50 * T) * k * .5, td.x - 3, 50 * T + (this.floorY - 50 * T) * k); x.lineTo(td.x + 3, 50 * T + (this.floorY - 50 * T) * k); x.quadraticCurveTo(td.x + 9, 50 * T + 40, td.x + 9, 50 * T); x.fill(); }
      } else {

    for (let k = 0; k < 6; k++) { const a = k / 6 * TAU + Math.sin(this.t * .7 + k) * .3; x.lineWidth = 6 - k % 3; x.beginPath(); x.moveTo(0, 0); x.bezierCurveTo(Math.cos(a) * 30, Math.sin(a) * 30, Math.cos(a + .4) * 50, Math.sin(a + .4) * 44, Math.cos(a + .2) * 64 + Math.sin(this.t * 2 + k) * 5, Math.sin(a + .2) * 56); x.stroke(); }
    // slab

    x.beginPath(); for (let k = 0; k < 7; k++) { const a = k / 7 * TAU + .3, rr = this.r * (.85 + hash(k) * .25); k ? x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * .85) : x.moveTo(Math.cos(a) * rr, Math.sin(a) * rr * .85); } x.closePath(); x.fill();
    x.strokeStyle = rgba('#7A4FB8', .9); x.lineWidth = 1.4; x.stroke();
    x.fillStyle = rgba('#3A2A50', .8); x.beginPath(); x.ellipse(0, -2, this.r * .55, this.r * .35, 0, 0, TAU); x.fill();

    const cracks = [[[-20, -10], [-6, -2], [-10, 12]], [[8, -22], [4, -6], [18, 4]], [[-4, 20], [6, 8], [22, 14]]];
    for (let i = 0; i < Math.max(1, cr + (this.phase > 1 ? 3 : 0)) && i < 3; i++) { const c = cracks[i]; x.beginPath(); x.moveTo(c[0][0], c[0][1]); x.lineTo(c[1][0], c[1][1]); x.lineTo(c[2][0], c[2][1]); x.stroke(); }
    if (this.phase > 1) { x.save(); x.globalCompositeOperation = 'lighter'; x.drawImage(Forge.glow('#FFFFFF', 64), -14, -14, 28, 28); x.restore(); }
    x.restore();

/* =====================================================================
   ESCAPES — the Ink Tide (horizontal flood / vertical rise)
   ===================================================================== */
const Tide = {
  update(dt) {
    const td = G.tide; if (!td) return;
    if (td.delay > 0) { td.delay -= dt; return; }
    const P = Player;
    if (td.mode === 'x') {
      const gap = P.cx - td.x; td.speed = td.base * (gap > 330 ? 1.7 : gap > 220 ? 1.15 : 1);
      td.x += td.speed * dt;
      if (!P.dead && P.cx < td.x + 6) Game.tideKill();
      if (Math.random() < dt * 40) Particles.emit('ink', td.x + rnd(-6, 6), Cam.cy + rnd(-VH / 2, VH / 2), rnd(20, 120), rnd(-120, 20), .7, rnd(2, 4));
    } else {
      td.speed = td.base; td.y -= td.speed * dt;
      if (!P.dead && P.y + P.h > td.y + 8) Game.tideKill();
      if (Math.random() < dt * 30) Particles.emit('ink', Cam.cx + rnd(-VW / 2, VW / 2), td.y, rnd(-30, 30), rnd(-160, -60), .7, rnd(2, 4));
    }
  },
  draw(x) {
    const td = G.tide; if (!td) return;
    const t = G.t, top = Cam.cy - VH, bot = Cam.cy + VH;
    if (td.mode === 'x') {
      const left = Cam.cx - VW;
      x.fillStyle = '#0B0B12'; x.beginPath(); x.moveTo(left, top);
      for (let y = top; y <= bot; y += 8) x.lineTo(td.x + Math.sin(y * .05 + t * 6) * 8 + Math.sin(y * .013 - t * 2) * 14, y);
      x.lineTo(left, bot); x.fill();
      x.strokeStyle = rgba('#7A4FB8', .8); x.lineWidth = 2; x.beginPath();
      for (let y = top; y <= bot; y += 8) { const px = td.x + Math.sin(y * .05 + t * 6) * 8 + Math.sin(y * .013 - t * 2) * 14; y === top ? x.moveTo(px, y) : x.lineTo(px, y); }
      x.stroke();
    } else {
      const l = Cam.cx - VW, r = Cam.cx + VW;
      x.fillStyle = '#0B0B12'; x.beginPath(); x.moveTo(l, bot + 400);
      for (let px = l; px <= r; px += 8) x.lineTo(px, td.y + Math.sin(px * .04 + t * 4) * 4 + Math.sin(px * .011 - t * 1.6) * 6);
      x.lineTo(r, bot + 400); x.fill();
      x.strokeStyle = rgba('#7A4FB8', .9); x.lineWidth = 2; x.beginPath();
      for (let px = l; px <= r; px += 8) { const py = td.y + Math.sin(px * .04 + t * 4) * 4 + Math.sin(px * .011 - t * 1.6) * 6; px === l ? x.moveTo(px, py) : x.lineTo(px, py); }
      x.stroke();
    }
  }
};

/* =====================================================================
   GLASS CRANE FLIGHT — auto-scrolling sky ride over the koi lake
   ===================================================================== */
const Flight = {
  start() {
    G.flight = { t: 0, dur: 22, y: VH * .45, vy: 0, blobs: [], motes: [], camx: World.w * T * .5, hitT: 0, spawnT: 1.2, moteT: .5 };
    Sound.wing(); Sound.surge(); G.tide = null; G.inEscape = false; G.prog.escDone[World.r] = 1;
    Game.say('crane', 'A Glass Crane! Hold on — steer with Up and Down.', true);
  },
  update(dt) {
    const f = G.flight; f.t += dt; f.hitT = Math.max(0, f.hitT - dt);
    const up = Input.down('up') || Input.down('jump') || Input.padMoveY < -.4, dn = Input.down('down') || Input.padMoveY > .4;
    f.vy = approach(f.vy, (dn ? 1 : 0) * 140 - (up ? 1 : 0) * 140, 700 * dt); f.y = clamp(f.y + f.vy * dt, 34, VH - 40);
    f.camx += 230 * dt;
    const k = f.t / f.dur;
    f.spawnT -= dt;
    if (f.spawnT <= 0 && f.t < f.dur - 2.5) { f.spawnT = lerp(1.3, .55, k) * rnd(.8, 1.2); f.blobs.push({ x: VW + 20, y: rnd(30, VH - 30), vx: -rnd(150, 230) - k * 60, ph: rnd(TAU), r: rnd(8, 14), t: 0 }); Sound.bubble(VW); }
    f.moteT -= dt; if (f.moteT <= 0) { f.moteT = rnd(.4, .8); f.motes.push({ x: VW + 10, y: rnd(30, VH - 30) }); }
    const cx = 150, cy = f.y;
    for (const b of f.blobs) { b.t += dt; b.x += b.vx * dt; b.y += Math.sin(b.t * 3 + b.ph) * 40 * dt; if (dist(b.x, b.y, cx, cy) < b.r + 9 && f.hitT <= 0) { f.hitT = 1; Player.hp = Math.max(1, Player.hp - 1); Sound.hurt(); Cam.shake(.4); G.chroma = .5; HUD.ping(); b.dead = true; } }
    for (const m of f.motes) { m.x -= 230 * dt; if (dist(m.x, m.y, cx, cy) < 20) { m.dead = true; G.prog.motes++; G.prog.stats.motes++; Sound.mote(m.x); HUD.ping(); } }
    f.blobs = f.blobs.filter(b => !b.dead && b.x > -30); f.motes = f.motes.filter(m => !m.dead && m.x > -20);
    if (Math.random() < dt * 30) Particles.emit('streak', Cam.cx + VW / 2, Cam.cy + rnd(-VH / 2, VH / 2), -600, 0, .5, 1, '#FFFFFF');
    if (f.t >= f.dur && !G.wipe) Game.endFlight();
  },
  draw(x) {
    const f = G.flight, S = Config.rs;
    x.setTransform(1, 0, 0, 1, 0, 0);
    BG.draw(x, { x: f.camx, y: 0, zoom: 1 }, THEMES.lake, G.rt, VH * 1.4);
    x.setTransform(S, 0, 0, S, 0, 0);
    for (let i = 0; i < 26; i++) { const sx = ((hash(i) * VW - f.t * 90 * (1 + hash(i * 2))) % VW + VW) % VW; x.globalAlpha = .25; x.fillStyle = '#FFFFFF'; x.fillRect(sx, hash(i * 3) * VH, 14, .6); }
    x.globalAlpha = 1;
    for (const m of f.motes) { x.save(); x.globalCompositeOperation = 'lighter'; x.drawImage(Forge.glow(Config.col.gold, 32), m.x - 6, m.y - 6, 12, 12); x.restore(); }
    for (const b of f.blobs) inkBlob(x, b.x, b.y, b.r, b.r * .85, b.t * 2, { glow: .4 });
    const cy = f.y, blink = f.hitT > 0 && Math.floor(G.rt * 20) % 2 === 0;
    x.globalAlpha = blink ? .5 : 1;
    drawCrane(x, 150, cy, f.t, true);
    drawKaze(x, 148, cy - 3, { face: 1, t: G.t, sq: 1 });
    x.globalAlpha = 1;
    for (let i = 0; i < 2; i++) Particles.emit('glow', 130 + rnd(-6, 6), cy + rnd(-4, 4), -120, rnd(-10, 10), .5, 2, Config.col.cyan);
  }
};

/* =====================================================================
   15. SAVE — in-memory progress + portable base64 save codes
   ===================================================================== */
const Save = {
  modalOpen: false,
  code() { return btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, p: G.prog, o: G.opts, b: Input.bind })))); },
  load(str) {
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob(String(str).trim()))));
      if (!d || !d.p || !d.p.abil || !d.p.cp) throw new Error('bad');
      G.prog = Object.assign(newProg(), d.p); G.prog.started = true;
      if (d.o) Object.assign(G.opts, d.o); if (d.b) Input.bind = Object.assign(JSON.parse(JSON.stringify(DEFAULT_BIND)), d.b);
      Sound.setVol(G.opts.vol); Particles.clear();
      World.load(clamp(G.prog.cp.r | 0, 0, REGIONS.length - 1), 'cp'); Player.hp = Player.maxHp(); G.state = 'play'; UI.banner(World.r);
      return true;
    } catch (e) { return false; }
  },
  open(mode) {
    const m = document.getElementById('save'), ta = document.getElementById('saveText'), msg = document.getElementById('saveMsg');
    if (!m) return;
    this.modalOpen = true; m.style.display = 'flex';
    ta.value = mode === 'save' ? this.code() : ''; msg.textContent = mode === 'save' ? 'Copy this code to keep your journey. Paste a code and press Load to restore one.' : 'Paste a save code, then press Load.';
    if (mode === 'save') { ta.focus(); ta.select(); } else ta.focus();
  },
  close() { const m = document.getElementById('save'); if (m) m.style.display = 'none'; this.modalOpen = false; Input.clearTaps(); Input.keys.clear(); },
  bindDom() {
    const $ = id => document.getElementById(id);
    if (!$('save')) return;
    $('saveCopy').onclick = () => {
      const ta = $('saveText'); ta.select();
      const done = () => { $('saveMsg').textContent = 'Copied. Keep it somewhere safe.'; };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { document.execCommand('copy'); done(); }); else { document.execCommand('copy'); done(); } } catch (e) { $('saveMsg').textContent = 'Select the text and copy it manually.'; }
    };
    $('saveLoad').onclick = () => { if (this.load($('saveText').value)) this.close(); else $('saveMsg').textContent = 'That code could not be read. Check it was copied whole.'; };
    $('saveClose').onclick = () => this.close();
    $('saveText').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') this.close(); });
  }
};

/* =====================================================================
   5b. POST-FX — Three.js r128: bright-pass, 2-pass gaussian bloom,
       chromatic shimmer, vignette, warm grade, 3% film grain
   ===================================================================== */
const PostFX = {
  ok: false,
  init(src, glc) {
    try {
      if (typeof THREE === 'undefined' || !glc) return;
      const r = new THREE.WebGLRenderer({ canvas: glc, antialias: false, alpha: false, powerPreference: 'high-performance' });
      r.setPixelRatio(1); r.setSize(1280, 720, false); r.autoClear = false;
      const tex = new THREE.CanvasTexture(src); tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false;
      const o = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, depthBuffer: false };
      this.rtA = new THREE.WebGLRenderTarget(320, 180, o); this.rtB = new THREE.WebGLRenderTarget(320, 180, o);
      const vs = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
      const mk = (u, fs) => new THREE.ShaderMaterial({ uniforms: u, vertexShader: vs, fragmentShader: fs, depthTest: false, depthWrite: false });
      this.mB = mk({ t: { value: tex }, th: { value: .8 } }, 'uniform sampler2D t; uniform float th; varying vec2 vUv; void main(){ vec3 c = texture2D(t, vUv).rgb; float l = dot(c, vec3(.299,.587,.114)); gl_FragColor = vec4(c * smoothstep(th, th + .25, l), 1.0); }');
      this.mBl = mk({ t: { value: null }, d: { value: new THREE.Vector2(1 / 320, 0) } }, 'uniform sampler2D t; uniform vec2 d; varying vec2 vUv; void main(){ vec3 c = texture2D(t, vUv).rgb * .227; c += texture2D(t, vUv + d * 1.385).rgb * .316; c += texture2D(t, vUv - d * 1.385).rgb * .316; c += texture2D(t, vUv + d * 3.23).rgb * .07; c += texture2D(t, vUv - d * 3.23).rgb * .07; gl_FragColor = vec4(c, 1.0); }');
      this.mC = mk({ t: { value: tex }, b: { value: null }, time: { value: 0 }, chroma: { value: 0 }, bloom: { value: .4 }, vig: { value: .55 }, expo: { value: .88 } },
        'uniform sampler2D t; uniform sampler2D b; uniform float time; uniform float chroma; uniform float bloom; uniform float vig; uniform float expo; varying vec2 vUv;' +
        'float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }' +
        'void main(){ vec2 uv = vUv; vec2 d = uv - .5; float r2 = dot(d, d); vec3 c;' +
        ' if (chroma > .001) { vec2 o = d * chroma * .014; c = vec3(texture2D(t, uv + o).r, texture2D(t, uv).g, texture2D(t, uv - o).b); } else c = texture2D(t, uv).rgb;' +
        ' c += texture2D(b, uv).rgb * bloom; c = mix(c, c * vec3(1.03, 1.0, .95), .3); c = pow(max(c * expo, 0.0), vec3(1.14)); float l = dot(c, vec3(.299,.587,.114)); c = mix(vec3(l), c, 1.1);' +
        ' c *= 1.0 - vig * smoothstep(.12, .8, r2 * 2.0); c += (h(uv * vec2(1280.0, 720.0) + fract(time)) - .5) * .03; gl_FragColor = vec4(c, 1.0); }');
      this.cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); this.scene = new THREE.Scene();
      const G2 = THREE.PlaneBufferGeometry || THREE.PlaneGeometry;
      this.quad = new THREE.Mesh(new G2(2, 2), this.mB); this.scene.add(this.quad);
      this.r = r; this.tex = tex; this.ok = true;
    } catch (e) { this.ok = false; }
  },
  render() {
    try {
      const r = this.r; this.tex.needsUpdate = true;
      this.quad.material = this.mB; r.setRenderTarget(this.rtA); r.clear(); r.render(this.scene, this.cam);
      for (let i = 0; i < 2; i++) {
        this.quad.material = this.mBl; this.mBl.uniforms.t.value = this.rtA.texture; this.mBl.uniforms.d.value.set((1 + i) / 320, 0); r.setRenderTarget(this.rtB); r.render(this.scene, this.cam);
        this.mBl.uniforms.t.value = this.rtB.texture; this.mBl.uniforms.d.value.set(0, (1 + i) / 180); r.setRenderTarget(this.rtA); r.render(this.scene, this.cam);
      }
      this.quad.material = this.mC; this.mC.uniforms.b.value = this.rtA.texture; this.mC.uniforms.time.value = G.rt; this.mC.uniforms.chroma.value = G.chroma; this.mC.uniforms.bloom.value = THEMES[World.theme] && THEMES[World.theme].dark ? .65 : .4; this.mC.uniforms.expo.value = .88 * G.opts.bright;
      r.setRenderTarget(null); r.render(this.scene, this.cam);
    } catch (e) { this.ok = false; Render.showFallback(); }
  }
};

/* =====================================================================
   4b. RENDERER — painterly 2D layers composited back-to-front
   ===================================================================== */
const PICK = new Set(['seed', 'heart', 'mote', 'life']);
const Render = {
  c2d: null, x: null, dark: null, dx: null, vig: null,
  init(c2d) {
    this.c2d = c2d; this.x = c2d.getContext('2d');
    this.dark = mkCanvas(320, 180); this.dx = this.dark.getContext('2d');
    this.vig = mkCanvas(640, 360); const v = this.vig.getContext('2d'), g = v.createRadialGradient(320, 180, 120, 320, 180, 400); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(10,6,14,.7)'); v.fillStyle = g; v.fillRect(0, 0, 640, 360);
    this.grainPat = this.x.createPattern(Forge.grain, 'repeat');
  },
  showFallback() { const gl = document.getElementById('gl'); if (gl) gl.style.display = 'none'; c2dEl.style.display = 'block'; },
  world(x) {
    const S = Config.rs * Cam.zoom, c = Math.cos(Cam.rot), s = Math.sin(Cam.rot);
    const tx = VW * Config.rs / 2 - Cam.cx * S + Cam.ox * Config.rs, ty = VH * Config.rs / 2 - Cam.cy * S + Cam.oy * Config.rs;
    x.setTransform(S * c, S * s, -S * s, S * c, tx, ty); x._wm = [S, 0, 0, S, tx, ty];
  },
  frame(a) {
    const x = this.x, S = Config.rs, st = G.state;
    x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
    if (st === 'title' || (st === 'options' || st === 'controls') && UI.back === 'title') this.title(x);
    else if (st === 'grand') Grand.draw(x);
    else if (st === 'credits') Credits.draw(x);
    else if (G.flight) { Flight.draw(x); x.setTransform(S, 0, 0, S, 0, 0); x._wm = [S, 0, 0, S, 0, 0]; Particles.draw(x); }
    else if (st === 'play' || !UI.snapCv) this.play(x, a);
    else if (st !== 'play') { /* paused: keep last frame under the UI snapshot */ }
    if (!PostFX.ok) {
      x.setTransform(1, 0, 0, 1, 0, 0); x.drawImage(this.vig, 0, 0, VW * S, VH * S); const ex = .88 * G.opts.bright; if (ex < 1) { x.fillStyle = rgba('#000000', 1 - ex); x.fillRect(0, 0, VW * S, VH * S); } else { x.save(); x.globalCompositeOperation = 'lighter'; x.fillStyle = rgba('#FFFFFF', (ex - 1) * .5); x.fillRect(0, 0, VW * S, VH * S); x.restore(); }
      x.save(); x.globalAlpha = .035; x.globalCompositeOperation = 'overlay'; x.translate(-(G.rt * 977 % 256), -(G.rt * 613 % 256)); x.fillStyle = this.grainPat; x.fillRect(0, 0, VW * S + 256, VH * S + 256); x.restore();
    }
  },
  title(x) {
    const S = Config.rs, t = G.rt, cam = { x: t * 9, y: 0, zoom: 1 };
    if (BG.theme !== 'hollow') BG.build('hollow');
    BG.draw(x, cam, THEMES.hollow, t, VH);
    x.setTransform(S, 0, 0, S, 0, 0); x._wm = [S, 0, 0, S, 0, 0];
    // a living cherry branch with Kaze resting on it
    const bx = 330, by = 196, sway = Math.sin(t * .9) * 1.5;
    x.strokeStyle = '#3A2430'; x.lineCap = 'round';
    x.lineWidth = 9; x.beginPath(); x.moveTo(VW + 20, 150); x.quadraticCurveTo(430, 175 + sway, bx - 30, by + sway); x.stroke();
    x.lineWidth = 3; x.beginPath(); x.moveTo(420, 172 + sway); x.quadraticCurveTo(400, 140, 380, 128 + sway); x.stroke(); x.beginPath(); x.moveTo(360, 192 + sway); x.quadraticCurveTo(340, 215, 318, 222 + sway); x.stroke();
    const rng = mulberry(7);
    for (let i = 0; i < 40; i++) { const px = lerp(bx - 40, VW + 10, rng()), py = 150 + (VW - px) * .12 + (rng() - .5) * 40 + sway; Forge.blob(x, px, py, 5 + rng() * 6, rng() < .5 ? '#F7B7C8' : '#FFD9E2', .5, rng); }
    for (let i = 0; i < 9; i++) x.drawImage(Forge.flower, 340 + hash(i) * 160 - 5, 150 + hash(i * 3) * 50 + sway - 5, 10, 10);
    const kx = bx + 12, ky = by - 3 + sway;
    Player.x = kx - Player.w / 2; Player.y = ky - Player.h + 2; Player.face = -1;
    Player.updScarf(1 / 60); drawScarf(x, Player.scarf, false);
    drawKaze(x, kx, ky, { face: -1, t, sq: .86 });
    Hoshi.x = kx - 22 + Math.sin(t * .8) * 4; Hoshi.y = ky - 26 + Math.sin(t * 1.3) * 3; Hoshi.t = t; Hoshi.draw(x);
    Particles.ambient(1 / 60, cam, THEMES.hollow); Particles.update(1 / 60); Particles.draw(x);
    x.setTransform(1, 0, 0, 1, 0, 0); BG.drawFG(x, cam, t);
  },
  play(x, a) {
    const S = Config.rs, th = THEMES[World.theme];
    BG.draw(x, Cam, th, G.rt, World.h * T);
    this.world(x);
    Tiles.draw(x, Cam, 2); Tiles.drawDynamic(x, Cam, G.rt, G.opts.outline);
    Bosses.drawTrails(x); World.drawEnts(x, G.rt, 0);
    if (G.boss && G.boss.draw) G.boss.draw(x);
    Enemies.draw(x); Proj.draw(x); Tide.draw(x);
    // ink-wash desaturation of unrestored regions, with the restoration wave hole
    if (!G.prog.restored[World.r]) this.desat(x);
    this.world(x);
    World.drawEnts(x, G.rt, 1);
    if (G.lock) this.petalWalls(x);
    Hoshi.draw(x); Player.draw(x, a);
    Particles.draw(x);
    for (const f of G.flashes) { const k = f.t / f.max; x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = k * k * .32; x.drawImage(Forge.glow('#FFE8F0', 128), f.x - f.r * (1.2 - k * .4), f.y - f.r * (1.2 - k * .4), f.r * 2 * (1.2 - k * .4), f.r * 2 * (1.2 - k * .4)); x.restore(); }
    if (th.dark) this.darkness(x);
    x.setTransform(1, 0, 0, 1, 0, 0);
    BG.drawFG(x, Cam, G.rt);
  },
  desat(x) {
    const S = Config.rs, W = VW * S, H = VH * S, R = G.restore;
    x.save(); x.setTransform(1, 0, 0, 1, 0, 0);
    x.beginPath(); x.rect(0, 0, W, H);
    let sp = null, rr = 0;
    if (R && R.rad > 0) { sp = Cam.toScreen(R.x, R.y); rr = R.rad * Cam.zoom * S; x.moveTo(sp.x * S + rr, sp.y * S); x.arc(sp.x * S, sp.y * S, rr, 0, TAU, true); }
    x.clip('evenodd');
    x.globalCompositeOperation = 'saturation'; x.globalAlpha = .86; x.fillStyle = '#808080'; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'multiply'; x.globalAlpha = .2; x.fillStyle = '#B4B0C4'; x.fillRect(0, 0, W, H);
    x.restore();
    if (sp) { x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'lighter'; const g = x.createRadialGradient(sp.x * S, sp.y * S, Math.max(0, rr - 50), sp.x * S, sp.y * S, rr + 10); g.addColorStop(0, 'rgba(255,217,226,0)'); g.addColorStop(.8, 'rgba(255,217,226,.35)'); g.addColorStop(1, 'rgba(255,217,226,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H); x.restore(); }
  },
  petalWalls(x) {
    const L = G.lock, t = G.rt;
    for (const wx of [L[0] * T, (L[2] + 1) * T]) {
      x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = .5; x.drawImage(Forge.glow(Config.col.pink, 64), wx - 16, Cam.cy - VH / 2, 32, VH); x.restore();
      for (let i = 0; i < 22; i++) { const y = Cam.cy - VH / 2 + ((i * 17 + t * 40 * (1 + hash(i))) % VH), ox = Math.sin(t * 2 + i) * 6; x.save(); x.translate(wx + ox, y); x.rotate(t * 2 + i); x.drawImage(Forge.petals[i % 5], -4, -4, 8, 8); x.restore(); }
    }
  },
  darkness(x) {
    const d = this.dx, sx = 320 / VW, restored = G.prog.restored[World.r];
    d.globalCompositeOperation = 'source-over'; d.clearRect(0, 0, 320, 180); d.fillStyle = restored ? 'rgba(6,3,8,.62)' : 'rgba(4,2,8,.94)'; d.fillRect(0, 0, 320, 180);
    d.globalCompositeOperation = 'destination-out';
    const L = (wx, wy, r, a) => { const s = Cam.toScreen(wx, wy), rr = r * Cam.zoom * sx; d.globalAlpha = a; d.drawImage(Forge.glow('#FFFFFF', 64), s.x * sx - rr, s.y * sx - rr, rr * 2, rr * 2); };
    L(Player.cx, Player.cy, 52 + (Player.charging ? Player.chargeT * 40 : 0), 1); L(Hoshi.x, Hoshi.y, Hoshi.thrown ? 110 : 92, 1);
    if (World.moth) L(World.moth.x, World.moth.y, 70, 1);
    for (const e of World.ents) { if (e.type === 'lantern') L(e.x, e.y, 64, 1); else if (e.type === 'well' || e.type === 'seed') L(e.x, e.y, 54, .9); else if (e.type === 'mote' || e.type === 'life') L(e.x, e.y, 26, .7); else if (e.type === 'exit') L(e.x, e.y - 10, 50, .8); }
    for (const f of G.flashes) L(f.x, f.y, f.r * (f.t / f.max) * 1.4, 1);
    for (const p of G.projs) if (p.friendly) L(p.x, p.y, 30, .8);
    for (const e of G.enemies) if (e.wind) L(e.x, e.y - e.h / 2, 30, .6);
    d.globalAlpha = 1;
    x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.drawImage(this.dark, 0, 0, VW * Config.rs, VH * Config.rs); x.restore();
  }
};

/* =====================================================================
   16b. MAIN LOOP — fixed 120 Hz simulation, interpolated rendering
   ===================================================================== */
let c2dEl, uiEl, uiX, last = 0, acc = 0, fpsT = 0, fpsN = 0, lowT = 0;
function tick() {
  G.ts = damp(G.ts, G.tsTarget, G.tsTarget < G.ts ? 30 : 5, STEP);
  if (G.hitstop > 0) { G.hitstop -= STEP; return; }
  Game.sim(STEP * G.ts * G.opts.speed, STEP * (G.cine ? .3 : 1));
}
function frame() {
  try { frameBody(); } catch (e) { if (typeof console !== 'undefined') console.error(e); G.hitstop = 0; }
  requestAnimationFrame(frame);
}
function frameBody() {
  const tn = now(); const rd = Math.min(.05, (tn - last) / 1000 || 0); last = tn; G.rt += rd;
  // adaptive particle cap
  fpsT += rd; fpsN++; if (fpsT > 1) { const fps = fpsN / fpsT; if (fps < 55) { lowT++; if (lowT > 1) Particles.cap = Math.max(450, Particles.cap * .8 | 0); } else { lowT = 0; Particles.cap = Math.min(G.opts.reduced ? 700 : 1800, Particles.cap + 60); } fpsT = 0; fpsN = 0; }
  Input.pollPad();
  UI.update(rd); Game.realUpdate(rd);
  if (G.state === 'play' && !UI.blocking()) { acc += rd; let n = 0; while (acc >= STEP && n < 8) { tick(); acc -= STEP; n++; } if (n >= 8) acc = 0; }
  Render.frame(clamp(acc / STEP, 0, 1));
  if (PostFX.ok) PostFX.render();
  UI.draw(uiX, rd);
  Sound.loops({ gust: Math.abs(G.gust) / 110, tide: !!G.tide && G.state === 'play', glide: Player.glide && G.state === 'play' ? clamp(Math.abs(Player.vx) / 150, .2, 1) : 0, charge: Player.charging && G.state === 'play' ? clamp(Player.chargeT / .55, 0, 1) : 0 });
  if (G.state === 'play') Sound.events(rd);
}
function fit() {
  const w = document.getElementById('wrap'); if (!w) return;
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  w.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
function boot() {
  c2dEl = document.getElementById('c2d'); uiEl = document.getElementById('ui'); uiX = uiEl.getContext('2d');
  Forge.init(); Particles.init(); Render.init(c2dEl);
  PostFX.init(c2dEl, document.getElementById('gl'));
  if (PostFX.ok) { c2dEl.style.display = 'none'; } else Render.showFallback();
  Input.init(uiEl); Save.bindDom();
  addEventListener('resize', fit); fit();
  BG.build('hollow'); Sound.setAmb(THEMES.hollow.amb);
  Player.place(340, 190);
  last = now(); requestAnimationFrame(frame);
}

boot();
</script>
